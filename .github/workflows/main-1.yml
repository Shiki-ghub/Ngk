name: Github workflow kernel build no resukisu 

on:
  workflow_dispatch:

env:
  BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex \
            git kmod libssl-dev python3 rsync unzip zip

      - name: Cache Proton-Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-toolchain

      - name: Clone Proton-Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/PainKiller3/AnyKernel3.git AnyKernel3

      - name: Build kernel
        run: bash compile.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_number }}
          path: out/outputs/**/*.zip
          if-no-files-found: warn

      - name: Send builds to Telegram
        if: success()
        run: |
          shopt -s globstar nullglob
          for file in out/outputs/**/*.zip; do
            curl -sS -F document=@"${file}" \
              -F chat_id="${CHANNEL_ID}" \
              -F caption="$(basename "${file}")" \
              "https://api.telegram.org/bot${BOT_API_KEY}/sendDocument"
          done
